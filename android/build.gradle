// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '36.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '36')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '36')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '2.0.21'

        ndkVersion = "28.2.13676358"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.9.2')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

// Expo's Fabric objects exceed Ninja's Windows path limit in this workspace.
// Keep generated native builds inside this checkout for libraries as well as the app.
if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
    subprojects { nativeProject ->
        nativeProject.plugins.withId('com.android.library') {
            def nativeAndroid = nativeProject.extensions.getByName('android')
            nativeAndroid.externalNativeBuild.cmake.buildStagingDirectory =
                rootProject.file('../artifacts/cxx/' + nativeProject.name)
            nativeAndroid.defaultConfig.externalNativeBuild.cmake.arguments '-DCMAKE_OBJECT_PATH_MAX=240'
        }
    }
}

allprojects {
    // Never look up stable Android artifacts in the injected snapshot repository.
    repositories.configureEach { repository ->
        if (repository instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
                && repository.url.toString().contains('/snapshots')) {
            repository.mavenContent { snapshotsOnly() }
        }
    }
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven {
            url 'https://www.jitpack.io'
            content { includeGroupByRegex 'com\\.github\\..*' }
        }
    }
}
